  strategy_notes:
  - Fonte utile per ricerca archivistica mirata negli archivi austriaci/OeStA, inclusi riferimenti potenzialmente collegati
    a militari, prigionia, reparti, luoghi o fascicoli.
  - La Feldsuche consente filtri per titolo, codice di riferimento, livello descrittivo, tipologia documentale e periodo;
    nel codice attuale va trattata come reference-only salvo implementazione dedicata ASP.NET.
  - I risultati di lista sono candidati archivistici e non devono generare EvidenceClaim pubblicabili senza apertura della
    descrizione e revisione umana.
