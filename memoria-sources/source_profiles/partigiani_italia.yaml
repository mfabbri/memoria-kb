  strategy_notes:
  - La ricerca pubblica usa una GET su /cerca/ con nome e cognome separati.
  - 'Il registry legacy usa name_order=surname_first: dal CSV ''COGNOME NOME'' ricava cognome e nome.'
  - nome_op e cognome_op sono impostati a contains per tollerare varianti e secondi nomi.
  - Il campo nome_batt va usato in una strategia separata quando sono disponibili alias o soprannomi curati.
  - Le schede persona complete possono richiedere autenticazione; la lista pubblica va trattata come candidate result list.
