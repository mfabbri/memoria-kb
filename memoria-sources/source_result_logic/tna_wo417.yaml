result_logic:
  source_id: tna_wo417
  engine: tna_discovery_advanced_search
  candidate_limit: 10
  too_broad_threshold: 50
  signals:
    result_link_selector: a[href*="/details/r/"]
    no_results_text:
    - We did not find any results for your search
    - No results found
    blocked_text:
    - Sign in
    - Access denied
    - restricted
  rules:
  - id: needs-login-or-blocked
    when:
      blocked: true
    assessment: blocked_or_dynamic
    review_required: true
  - id: no-result-links
    when:
      detail_link_count_equals: 0
    assessment: no_results
    review_required: false
  - id: bounded-candidate-list
    when:
      detail_link_count_between:
      - 1
      - 10
    assessment: candidate_results
    collect_candidate_links: true
    max_candidate_links: 10
    review_required: true
  - id: truncated-candidate-list
    when:
      detail_link_count_greater_than: 10
    assessment: candidate_results_truncated
    collect_candidate_links: true
    max_candidate_links: 10
    review_required: true
  - id: too-broad
    when:
      detail_link_count_greater_than: 50
    assessment: too_broad
    collect_candidate_links: false
    review_required: true
  review_notes:
  - Una voce Discovery e' un candidato archivistico, non una prova biografica.
  - La scheda dettaglio TNA va aperta per verificare titolo, reference, descrizione e contesto della serie.
  - 'La fonte richiede credenziali e navigazione autenticata: i test ordinari devono usare fixture offline.'
