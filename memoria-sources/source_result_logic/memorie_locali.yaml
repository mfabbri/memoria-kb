result_logic:
  source_id: memorie_locali
  engine: memorie_locali_full_text_search
  candidate_limit: 10
  too_broad_threshold: 50

  signals:
    # Fonte ombrello su Resistenza mAPPe.
    # La ricerca produce pagine territoriali/eventuali pagine evento, non schede persona strutturate.
    result_link_selector: 'main a[href], article a[href], .content a[href], .entry-content a[href], .search-results a[href]'

    no_results_text:
      - Nessun risultato
      - No results found
      - La ricerca non ha prodotto risultati
      - 0 risultati
      - Nothing Found

    blocked_text:
      - login
      - access denied
      - captcha
      - verifica di sicurezza
      - temporarily unavailable

  candidate_filters:
    include_url_patterns:
      - "resistenzamappe.it/"

    exclude_url_patterns:
      - "javascript:"
      - "mailto:"
      - "#"
      - "/wp-content/"
      - "/wp-includes/"
      - "/feed"
      - "attachment_id="
      - "replytocom="
      - "preview="
      - "login"
      - "logout"
      - "signin"
      - "signup"
      - "cookie"
      - "privacy"
      - "terms"
      - "contatti"
      - "contact"
      - "search"
      - "?s="
      - "/author/"
      - "/tag/"
      - "/category/"
      - "facebook.com"
      - "twitter.com"
      - "x.com"
      - "instagram.com"
      - "youtube.com"

    exclude_title_patterns:
      - "Login"
      - "Logout"
      - "Accedi"
      - "Esci"
      - "Home"
      - "Cerca"
      - "Ricerca"
      - "Search"
      - "Help"
      - "Aiuto"
      - "Contatti"
      - "Privacy"
      - "Cookie"
      - "Facebook"
      - "Twitter"
      - "Instagram"
      - "YouTube"
      - "RSS"
      - "Read more"
      - "Leggi tutto"

    min_title_length: 4
    require_non_empty_title: true

  rules:
    - id: blocked-or-manual
      when:
        blocked: true
      assessment: search_url_ready
      review_required: true

    - id: no-result-links
      when:
        detail_link_count_equals: 0
      assessment: no_results
      review_required: false

    - id: bounded-candidate-list
      when:
        detail_link_count_between:
          - 1
          - 10
      assessment: candidate_results
      collect_candidate_links: true
      max_candidate_links: 10
      review_required: true

    - id: truncated-candidate-list
      when:
        detail_link_count_greater_than: 10
      assessment: candidate_results_truncated
      collect_candidate_links: true
      max_candidate_links: 10
      review_required: true

    - id: too-broad
      when:
        detail_link_count_greater_than: 50
      assessment: too_broad
      collect_candidate_links: false
      review_required: true

  review_notes:
    - La fonte è una fonte ombrello per memoria territoriale e percorsi resistenziali.
    - I risultati sono candidate references a pagine di contesto, luoghi o eventi, non prove personali.
    - Non trasformare automaticamente i risultati in EvidenceClaim personali.
    - Usare la fonte per arricchire contesto territoriale, eventi, luoghi e bibliografia locale.
    - Ogni pagina candidata deve essere aperta e revisionata prima di collegarla a una persona.