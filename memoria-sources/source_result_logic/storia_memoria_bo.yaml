result_logic:
  source_id: storia_memoria_bo
  engine: storia_memoria_bo_advanced_people
  candidate_limit: 10
  too_broad_threshold: 50
  signals:
    result_link_selector: a[href*="/archivio/persone/"]
    result_link_title_attribute: title
    no_results_text:
    - Nessun risultato
    - La ricerca non ha prodotto risultati
  rules:
  - id: no-result-links
    when:
      detail_link_count_equals: 0
    assessment: no_results
    review_required: false
  - id: bounded-candidate-list
    when:
      detail_link_count_between:
      - 1
      - 10
    assessment: candidate_results
    collect_candidate_links: true
    max_candidate_links: 10
    review_required: true
  - id: truncated-candidate-list
    when:
      detail_link_count_greater_than: 10
    assessment: candidate_results_truncated
    collect_candidate_links: true
    max_candidate_links: 10
    review_required: true
  - id: too-broad
    when:
      detail_link_count_greater_than: 50
    assessment: too_broad
    collect_candidate_links: false
    review_required: true
  review_notes:
  - Un link a una scheda persona e' un candidato, non ancora un claim.
  - La scheda dettaglio puo' diventare SourceDocument verificabile solo dopo fetch/lettura della pagina persona.
  - La logica attuale del connettore legacy arricchisce gli hit con testo dettaglio, ma la futura pipeline evidence-aware
    dovra' separare result list, detail document ed EvidenceClaim.
