detail_logic:
  source_id: german_docs_in_russia_wwii
  detail_level: detail_document_only
  engine: german_docs_in_russia_archival_detail
  blocked_text:
  - captcha
  - access denied
  - temporarily unavailable
  - session expired
  field_patterns:
  - id: fund
    from: body_text
    pattern: '(?:Fond|Фонд)\s+([0-9A-Za-z./-]+)'
    group: 1
  - id: inventory
    from: body_text
    pattern: '(?:Opis|Опись)\s+([0-9A-Za-z./-]+)'
    group: 1
  - id: file_number
    from: body_text
    pattern: '(?:Delo|Дело)\s+([0-9A-Za-z./-]+)'
    group: 1
  - id: title
    from: heading
    pattern: (.{4,240})
    group: 1
  - id: covering_dates
    from: body_text
    pattern: '([0-9]{2}\.[0-9]{2}\.[0-9]{4}|[0-9]{4}(?:\s*[-/]\s*[0-9]{4})?)'
    group: 1
  claim_mappings:
  - field: archive.fund
    signal_field: fund
    confidence: 0.55
  - field: archive.inventory
    signal_field: inventory
    confidence: 0.55
  - field: archive.file
    signal_field: file_number
    confidence: 0.55
  - field: archive.title
    signal_field: title
    confidence: 0.5
  - field: archive.covering_dates
    signal_field: covering_dates
    confidence: 0.45
  rules:
  - id: blocked-detail
    when:
      blocked: true
    assessment: detail_needs_manual_review
    review_required: true
  - id: extracted-archival-fields
    when:
      extracted_field_count_greater_than: 0
    assessment: archival_metadata_candidates_extracted
    review_required: true
  - id: fetched-no-fields
    when:
      extracted_field_count_equals: 0
    assessment: detail_document_fetched
    review_required: true
  review_notes:
  - Le pagine di dettaglio sono fonti primarie digitalizzate o contenitori archivistici, non schede persona.
  - I metadati estratti automaticamente sono solo candidati; completare manualmente gerarchia, titolo, date, pagina e URL.
  - Per ogni immagine o PDF scaricato creare o aggiornare un sidecar metadata.json prima di OCR o claim extraction.
  - Rispettare l'accordo d'uso del sito, in particolare per dati personali e riproduzione dei documenti.
