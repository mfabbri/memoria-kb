detail_logic:
  source_id: cwgc
  detail_level: claims_extractable
  engine: cwgc_casualty_detail
  blocked_text:
  - Access denied
  - temporarily unavailable
  field_patterns:
  - id: person_name
    from: heading
    pattern: ^(.+)$
  - id: rank
    from: body_text
    pattern: Rank\s*:?\s*([A-Z][A-Za-z .'/-]{2,80}?)(?:\s+Service No\.|\s+Date of Death|\s+Age|\s+Cemetery|\s+Panel|\s+$)
  - id: service_number
    from: body_text
    pattern: Service No\.?\s*:?\s*([A-Z0-9/-]{2,40})
  - id: death_date
    from: body_text
    pattern: Date of Death\s*:?\s*([0-9]{1,2}\s+[A-Za-z]+\s+[0-9]{4})
  - id: age_at_death
    from: body_text
    pattern: Age\s*:?\s*([0-9]{1,3})
  - id: cemetery_memorial
    from: body_text
    pattern: (?:Cemetery|Memorial)\s*:?\s*([A-Z][A-Za-z0-9 .'(),/-]{3,120})
  claim_mappings:
  - field: person.full_name
    signal_field: person_name
    confidence: 0.85
  - field: military.rank
    signal_field: rank
    confidence: 0.8
  - field: military.service_number
    signal_field: service_number
    confidence: 0.8
  - field: death.date
    signal_field: death_date
    confidence: 0.8
  - field: death.age
    signal_field: age_at_death
    confidence: 0.7
  - field: burial.memorial
    signal_field: cemetery_memorial
    confidence: 0.75
  rules:
  - id: blocked-detail
    when:
      blocked: true
    assessment: detail_needs_manual_review
    review_required: true
  - id: extracted-cwgc-fields
    when:
      extracted_field_count_greater_than: 1
    assessment: claim_candidates_extracted
    review_required: true
  - id: fetched-without-fields
    when:
      extracted_field_count_equals: 0
    assessment: detail_document_fetched
    review_required: true
  review_notes:
  - La scheda CWGC e' una fonte di dettaglio, ma i claim restano candidati finche' non vengono revisionati.
  - Le corrispondenze close matches devono essere trattate come candidati da confermare manualmente.
