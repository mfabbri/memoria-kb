detail_logic:
  source_id: albi_memoria_re
  detail_level: claims_extractable
  engine: albi_memoria_re_detail
  blocked_text:
  - login
  - access denied
  - captcha
  - restricted
  - temporarily unavailable
  - abilita javascript
  - enable javascript
  field_patterns:
  - id: person_name
    from: heading
    pattern: ^(.+)$
    group: 1
  - id: family_name
    from: body_text
    pattern: Cognome\s*:?\s*([^|;\n]+?)(?:\s{2,}| Nome\b| Data\b|$)
    group: 1
  - id: given_name
    from: body_text
    pattern: Nome\s*:?\s*([^|;\n]+?)(?:\s{2,}| Cognome\b| Data\b|$)
    group: 1
  - id: birth_date
    from: body_text
    pattern: Data Nascita\s*:?\s*([0-9]{1,2}[/-][0-9]{1,2}[/-][0-9]{2,4}|[0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{1,2} [A-Za-zÀ-ÿ]+ [0-9]{4})
    group: 1
  - id: birth_year
    from: body_text
    pattern: Anno Nascita\s*:?\s*([12][0-9]{3})
    group: 1
  - id: birth_place
    from: body_text
    pattern: Comune Nascita\s*:?\s*([^|;\n]+?)(?:\s{2,}| Luogo\b| Data\b|$)
    group: 1
  - id: death_date
    from: body_text
    pattern: Data Morte\s*:?\s*([0-9]{1,2}[/-][0-9]{1,2}[/-][0-9]{2,4}|[0-9]{4}-[0-9]{2}-[0-9]{2}|[0-9]{1,2} [A-Za-zÀ-ÿ]+ [0-9]{4})
    group: 1
  - id: death_place
    from: body_text
    pattern: Luogo Morte\s*:?\s*([^|;\n]+?)(?:\s{2,}| Data\b| Comune\b|$)
    group: 1
  claim_mappings:
  - field: person.full_name
    signal_field: person_name
    confidence: 0.6
  - field: person.family_name
    signal_field: family_name
    confidence: 0.75
  - field: person.given_name
    signal_field: given_name
    confidence: 0.75
  - field: birth.date
    signal_field: birth_date
    confidence: 0.75
  - field: birth.year
    signal_field: birth_year
    confidence: 0.65
  - field: birth.place
    signal_field: birth_place
    confidence: 0.7
  - field: death.date
    signal_field: death_date
    confidence: 0.75
  - field: death.place
    signal_field: death_place
    confidence: 0.7
  rules:
  - id: blocked-detail
    when:
      blocked: true
    assessment: detail_needs_manual_review
    review_required: true
  - id: extracted-fields
    when:
      extracted_field_count_greater_than: 0
    assessment: claim_candidates_extracted
    review_required: true
  - id: fetched-no-claims
    when:
      extracted_field_count_equals: 0
    assessment: detail_document_fetched
    review_required: true
  review_notes:
  - La scheda di dettaglio deve essere conservata come SourceDocument prima di derivare claim.
  - Le etichette osservate online sono Cognome, Nome, Data Nascita, Anno Nascita, Comune Nascita, Luogo Morte e Data Morte.
  - I claim estratti automaticamente sono candidati e richiedono revisione storica.
