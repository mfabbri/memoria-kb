detail_logic:
  source_id: tna_hs9
  detail_level: detail_document_only
  engine: tna_discovery_advanced_detail
  blocked_text:
  - login
  - access denied
  - captcha
  - restricted
  - temporarily unavailable
  field_patterns:
  - id: record_title
    from: heading
    pattern: ^(.+)$
  - id: archival_reference
    from: body_text
    pattern: Reference\s*:?\s*(HS\s*9/[A-Za-z0-9/-]+)
  - id: covering_dates
    from: body_text
    pattern: Date\s*:?\s*([0-9]{4}(?:\s*-\s*[0-9]{4})?)
  - id: person_name
    from: body_text
    pattern: Name(?:\(s\))?\s*:?\s*([A-Z][A-Za-z .'-]{3,120}?)\s*(?:Description\s*:|Held by\s*:|Legal status\s*:|$)
  claim_mappings:
  - field: archive.title
    signal_field: record_title
    confidence: 0.7
  - field: archive.reference
    signal_field: archival_reference
    confidence: 0.9
  - field: archive.covering_dates
    signal_field: covering_dates
    confidence: 0.8
  - field: person.full_name
    signal_field: person_name
    confidence: 0.7
  rules:
  - id: blocked-detail
    when:
      blocked: true
    assessment: detail_needs_manual_review
    review_required: true
  - id: extracted-fields
    when:
      extracted_field_count_greater_than: 0
    assessment: claim_candidates_extracted
    review_required: true
  - id: fetched-no-claims
    when:
      extracted_field_count_equals: 0
    assessment: detail_document_fetched
    review_required: true
  review_notes:
  - La pagina di dettaglio, quando disponibile, va conservata come SourceDocument.
  - I claim estratti automaticamente sono candidati e richiedono revisione umana.
  - La pagina o il record va conservato come SourceDocument; i collegamenti personali richiedono revisione umana.
