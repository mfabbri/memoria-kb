detail_logic:
  source_id: bundesarchiv_invenio
  detail_level: detail_document_only
  engine: bundesarchiv_invenio_detail
  blocked_text:
  - Sitzung abgelaufen
  - Anmeldung erforderlich
  - Bitte melden Sie sich an
  - access denied
  - Zugriff verweigert
  - captcha
  - Wartungsarbeiten
  field_patterns:
  - id: archive_reference
    from: body_text
    pattern: (?:Signatur|Archivsignatur|Signatur Verweis)\s*[:：]?\s*(BArch\s*)?([A-ZÄÖÜ0-9][A-ZÄÖÜ0-9\\-_/ .]{2,120})
    group: 2
  - id: title
    from: body_text
    pattern: (?:Titel|Bestandsbezeichnung|Klassifikationstitel|Originaltitel)\s*[:：]?\s*([^\n;]{3,260})
    group: 1
  - id: covering_dates
    from: body_text
    pattern: (?:Laufzeit|Datierung|Zeitraum|Stand)\s*[:：]?\s*([0-9]{4}(?:\s*[-–]\s*[0-9]{4})?|[0-9]{1,2}\\.[0-9]{1,2}\\.[0-9]{4})
    group: 1
  - id: record_group
    from: body_text
    pattern: (?:Bestand|Bestandsbezeichnung)\s*[:：]?\s*([^\n;]{2,180})
    group: 1
  - id: classification_title
    from: body_text
    pattern: (?:Klassifikationstitel)\s*[:：]?\s*([^\n;]{2,220})
    group: 1
  - id: description
    from: body_text
    pattern: (?:Enthält|Beschreibung|Inhalt)\s*[:：]?\s*([^\n]{10,500})
    group: 1
  - id: archival_level
    from: body_text
    pattern: (?:Archivalientyp|Unterlagenart|Stufe|Record-Art)\s*[:：]?\s*([^\n;]{2,160})
    group: 1
  - id: digital_available
    from: body_text
    pattern: (?:Digitalisat|Digitalisat anzeigen|Nur Treffer mit Digitalisaten)
    group: 0
  - id: file_number
    from: body_text
    pattern: (?:Aktenzeichen|Registriernr\\.?|Registriernummer)\s*[:：]?\s*([^\n;]{2,160})
    group: 1
  - id: organization_unit
    from: body_text
    pattern: (?:Aktenführende Organisationseinheit|Dienststelle|Behörde)\s*[:：]?\s*([^\n;]{2,180})
    group: 1
  - id: usage_location
    from: body_text
    pattern: (?:Benutzungsort|Standort)\s*[:：]?\s*([^\n;]{2,160})
    group: 1
  claim_mappings:
  - field: archive.reference
    signal_field: archive_reference
    confidence: 0.75
  - field: archive.title
    signal_field: title
    confidence: 0.68
  - field: archive.covering_dates
    signal_field: covering_dates
    confidence: 0.65
  - field: archive.record_group
    signal_field: record_group
    confidence: 0.65
  - field: archive.classification_title
    signal_field: classification_title
    confidence: 0.6
  - field: archive.description
    signal_field: description
    confidence: 0.55
  - field: archive.level
    signal_field: archival_level
    confidence: 0.55
  - field: archive.file_number
    signal_field: file_number
    confidence: 0.6
  - field: archive.creating_organization
    signal_field: organization_unit
    confidence: 0.55
  - field: archive.holding_location
    signal_field: usage_location
    confidence: 0.55
  - field: digital_object.available
    signal_field: digital_available
    confidence: 0.5
  rules:
  - id: blocked-detail
    when:
      blocked: true
    assessment: detail_needs_manual_review
    review_required: true
  - id: extracted-fields
    when:
      extracted_field_count_greater_than: 0
    assessment: claim_candidates_extracted
    review_required: true
  - id: fetched-no-claims
    when:
      extracted_field_count_equals: 0
    assessment: detail_document_fetched
    review_required: true
  review_notes:
  - La UI autenticata conferma l'esistenza di direct link e dettagli archivistici, ma l'estrazione deve restare prudente finche' non abbiamo fixture dedicate di pagine record reali.
  - I claim principali da questa fonte sono riferimenti archivistici, segnature, classificazioni, intervalli cronologici e indicatori di digitalizzazione.
  - Le eventuali informazioni biografiche vanno sempre riconciliate con fonti italiane o con altre fonti archivistiche prima di diventare fatti pubblicabili.
  - La pagina o il record va conservato come SourceDocument; i collegamenti personali richiedono revisione umana.
