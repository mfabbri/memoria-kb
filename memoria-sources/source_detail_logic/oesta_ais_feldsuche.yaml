detail_logic:
  source_id: oesta_ais_feldsuche
  detail_level: manual_review_only
  engine: oesta_ais_field_search_detail
  blocked_text:
  - login
  - access denied
  - captcha
  - restricted
  - temporarily unavailable
  - session expired
  field_patterns:
  - id: archive_reference
    from: body_text
    pattern: (?:Ref\.? code|Reference Code|Signatur|Archivsignatur)\s*[:：]?\s*([^\n;]{2,120})
    group: 1
  - id: title
    from: heading
    pattern: (.{2,200})
    group: 1
  - id: covering_dates
    from: body_text
    pattern: (?:Time period|Zeitraum|Datierung|Laufzeit)\s*[:：]?\s*([0-9]{4}(?:\s*[-–]\s*[0-9]{4})?)
    group: 1
  - id: level_of_description
    from: body_text
    pattern: (?:Level of description|Verzeichnungsstufe)\s*[:：]?\s*([^\n;]{2,120})
    group: 1
  claim_mappings:
  - field: archive.reference
    signal_field: archive_reference
    confidence: 0.6
  - field: archive.title
    signal_field: title
    confidence: 0.5
  - field: archive.covering_dates
    signal_field: covering_dates
    confidence: 0.55
  - field: archive.level_of_description
    signal_field: level_of_description
    confidence: 0.5
  rules:
  - id: blocked-detail
    when:
      blocked: true
    assessment: detail_needs_manual_review
    review_required: true
  - id: extracted-fields
    when:
      extracted_field_count_greater_than: 0
    assessment: claim_candidates_extracted
    review_required: true
  - id: fetched-no-claims
    when:
      extracted_field_count_equals: 0
    assessment: detail_document_fetched
    review_required: true
  review_notes:
  - La pagina di dettaglio, quando disponibile, va conservata come SourceDocument.
  - I claim estratti sono riferimenti archivistici candidati, utili a orientare la ricerca, non fatti biografici pubblicabili.
  - Collegare eventuali riferimenti a persone solo tramite Evidence Reconciliation e revisione storica.
  - 'Fonte da trattare come richiesta o verifica manuale: non generare claim automatici senza intervento archivistico.'
