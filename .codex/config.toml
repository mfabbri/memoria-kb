# Me.Mo.Ri.A Codex model routing.
# GPT-6 family policy v3.0 (2026-10-02).
# Keep the parent inexpensive; delegate substantive work to explicit specialists.

model = "gpt-6-luna"
model_reasoning_effort = "low"
plan_mode_reasoning_effort = "low"

sandbox_mode = "workspace-write"
approval_policy = "on-request"

# Keep the skill catalog small. Skill bodies are loaded only when selected.
[skills]
max_context_tokens = 2000

[agents]
enabled = true
max_concurrent_threads_per_session = 3
# Safe default for ad-hoc subagents. Named project agents override it explicitly.
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"
interrupt_message = true

[agents.mmr_scanner]
description = "Discovery read-only e ricognizione meccanica."
config_file = "agents/mmr-scanner.toml"

[agents.mmr_docs_reviewer]
description = "Verifica read-only di documentazione, contratti e guardrail."
config_file = "agents/mmr-docs-reviewer.toml"

[agents.mmr_docs_editor]
description = "Modifiche semplici e circoscritte a docs, planner e configurazione agent."
config_file = "agents/mmr-docs-editor.toml"

[agents.mmr_implementer]
description = "Fix e micro-feature nel codice entro contratti esistenti."
config_file = "agents/mmr-implementer.toml"

[agents.mmr_test_reviewer]
description = "Review tecnica indipendente, regressioni, edge case e quality gate."
config_file = "agents/mmr-test-reviewer.toml"

[agents.mmr_architect]
description = "Architettura, migrazioni e trade-off multi-repository; usare solo dopo routing high."
config_file = "agents/mmr-architect.toml"
