# Me.Mo.Ri.A Codex model routing.
# Project-local [profiles.*] are intentionally absent: Codex ignores them here.
# The parent is a low-cost router; specialized agents perform substantive work.

model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
interrupt_message = true

[agents.scanner]
description = "Discovery read-only e ricognizione meccanica."
config_file = "agents/scanner.toml"

[agents.docs_reviewer]
description = "Verifica read-only di documentazione, contratti e guardrail."
config_file = "agents/docs-reviewer.toml"

[agents.docs_editor]
description = "Modifiche semplici e circoscritte a docs, planner e configurazione agent."
config_file = "agents/docs-editor.toml"

[agents.implementer]
description = "Fix e micro-feature nel codice entro contratti esistenti."
config_file = "agents/implementer.toml"

[agents.test_reviewer]
description = "Review tecnica indipendente, regressioni, edge case e quality gate."
config_file = "agents/test-reviewer.toml"

[agents.architect]
description = "Architettura, migrazioni e trade-off multi-repository; usare solo dopo routing high."
config_file = "agents/architect.toml"
