[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caduti-fonti-report"
version = "0.1.0"
description = "Report offline e semi-automatici sulle fonti dei caduti di Purocielo."
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "Pillow",
    "pytest",
    "ruff",
]
ocr = [
    "Pillow",
]
excel = [
    "xlrd",
]
browser = [
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
where = ["code"]

[project.scripts]
memoria = "caduti_fonti_report.memoria_cli:main"

[tool.ruff]
line-length = 120
src = ["code", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
