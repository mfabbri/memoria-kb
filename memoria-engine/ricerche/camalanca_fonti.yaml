  - birth.date
  - birth.place
  - birth.province
  - formation.name
  - role.status
  - note.source_row
  raw_storage:
    enabled: true
    strategy: local_table_row
  review:
    required: true
    reason: 'Ogni risultato Ã¨ candidato: nessun fatto storico deve essere pubblicato senza evidenza e revisione.'
  local:
    workbook_dir: archivi/storia.sba.unibo.it
    workbook_glob: '*.xls'
    sheet_name: Foglio1
    name_order: surname_first
    surname_column: Cognome
    given_name_column: Nome
    alias_columns: Nome battaglia
    snippet_columns: Nome battaglia,Nato amg,Nato comune,Nato provincia,Brigata di appartenenza,Partigiano Patriota,Varie
  extraction:
    method: local_table_claims
    claim_mappings:
    - column: Nome battaglia
      field: alias
      confidence: 0.8
    - column: Nato amg
      field: birth.date
      confidence: 0.75
    - column: Nato comune
      field: birth.place
      confidence: 0.8
    - column: Nato provincia
      field: birth.province
      confidence: 0.8
    - column: Brigata di appartenenza
      field: formation.name
      confidence: 0.8
    - column: Partigiano Patriota
      field: role.status
      confidence: 0.75
    - column: Varie
      field: note.source_row
      confidence: 0.6
  note: Ricerca locale nei file Excel esportati di Storia e Memoria; il connettore scorre tutti i `.xls` della cartella configurata, confronta cognome e nome con le righe dei workbook e restituisce uno snippet dalla riga trovata.
